name: ElevenLabs TTS

# Озвучивает текст задачи с меткой "elevenlabs" и прикладывает mp3 к запуску.
on:
  issues:
    types: [labeled]
  # «еще раз» / «повтори» в комментарии карточки запускает озвучку заново
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  tts:
    # Новая карточка с меткой приходит и как opened, и как labeled — слушаем только labeled, чтобы не было двух запусков
    if: >-
      github.actor == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'elevenlabs') &&
      (github.event.label.name == 'elevenlabs' ||
       (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'еще раз') || contains(github.event.comment.body, 'ещё раз') || contains(github.event.comment.body, 'повтори'))))
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      # Голос по умолчанию (Rachel); можно указать свой в поле «Голос» задачи
      DEFAULT_VOICE: 21m00Tcm4TlvDq8ikWfM
    steps:
      - name: Разобрать задачу
        id: parse
        run: |
          python3 - <<'PY'
          import os, re, json
          body = os.environ.get("ISSUE_BODY") or ""
          # Служебные пометки доски (<!-- статус: … -->) не озвучиваем
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          def section(name):
              m = re.search(r"### " + re.escape(name) + r"\s*\n(.*?)(?=\n### |\Z)", body, re.S)
              v = m.group(1).strip() if m else ""
              return "" if v == "_No response_" else v
          text = section("Текст для озвучки / что нужно сделать") or body.strip()
          voice = section("Голос") or os.environ["DEFAULT_VOICE"]
          json.dump({"text": text, "model_id": "eleven_multilingual_v2"}, open("payload.json", "w"), ensure_ascii=False)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"voice={voice}\n")
          PY

      - name: Запросить озвучку
        env:
          VOICE: ${{ steps.parse.outputs.voice }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "Секрет ELEVENLABS_API_KEY не задан в настройках репозитория." > error.txt
            exit 1
          fi
          code=$(curl -sS -o speech.mp3 -w '%{http_code}' \
            -X POST "https://api.elevenlabs.io/v1/text-to-speech/$VOICE" \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: audio/mpeg" \
            --data @payload.json)
          if [ "$code" != "200" ]; then
            # Ответ ElevenLabs с причиной ошибки (ключ в нём не возвращается)
            { echo "ElevenLabs ответил $code:"; head -c 600 speech.mp3; } > error.txt
            cat error.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: issue-${{ github.event.issue.number }}-speech
          path: speech.mp3

      - name: Ответить в задаче
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          N: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          url="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          if [ "$RESULT" = "success" ]; then
            msg="Озвучка готова: mp3 в разделе Artifacts запуска $url"
            gh issue edit "$N" -R "$REPO" --add-label needs-review
          else
            msg="Не удалось получить озвучку. $(cat error.txt 2>/dev/null)
          Подробности: $url"
          fi
          gh issue comment "$N" -R "$REPO" --body "$msg"
